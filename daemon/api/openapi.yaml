openapi: 3.0.3
info:
  title: msmd — Minecraft Server Manager daemon
  version: 0.1.0
  description: >
    HTTP + Server-Sent-Events API for managing Minecraft servers on a remote
    host. All endpoints are served over TLS. Every route except /v1/health and
    /v1/pair requires a bearer token.
servers:
  - url: https://{host}:8443
    variables:
      host:
        default: localhost
security:
  - bearerAuth: []
paths:
  /v1/health:
    get:
      summary: Liveness probe (no auth)
      security: []
      responses:
        "200": { description: OK }
  /v1/pair:
    post:
      summary: Exchange the pairing token for the API token + host info (no auth header)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { token: { type: string } }
      responses:
        "200": { description: Paired }
        "401": { description: Invalid pairing token }
  /v1/info:
    get:
      summary: Host info (os, arch, detected Java installations, agent version)
      responses: { "200": { description: OK } }
  /v1/loaders/{loader}/versions:
    get:
      summary: List available versions for a mod loader or plugin platform (fabric|quilt|forge|neoforge|paper|purpur|folia)
      description: >
        For paper, purpur and folia the result is the builds for the given Minecraft
        version, newest first, as `[{ "version": "<build>", "stable": true|false }]`.
      parameters:
        - { name: loader, in: path, required: true, schema: { type: string } }
        - { name: mc, in: query, required: false, schema: { type: string } }
      responses: { "200": { description: OK }, "400": { description: "Unknown loader, or a malformed mc for paper/purpur/folia" } }
  /v1/software/{platform}/versions:
    get:
      summary: List the Minecraft release versions a plugin platform has builds for (paper|purpur|folia)
      parameters:
        - { name: platform, in: path, required: true, schema: { type: string, enum: [paper, purpur, folia] } }
      responses:
        "200":
          description: JSON array of Minecraft release versions, newest first
          content:
            application/json:
              schema: { type: array, items: { type: string } }
        "400": { description: Unknown platform }
        "502": { description: The upstream API failed }
  /v1/servers:
    get:
      summary: List servers
      responses: { "200": { description: OK } }
    post:
      summary: Create a server (provisions asynchronously)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, minecraftVersion]
              properties:
                name: { type: string }
                minecraftVersion: { type: string, description: "Must be a release version for paper|purpur|folia" }
                modLoader: { type: string, enum: [fabric, quilt, forge, neoforge, paper, purpur, folia] }
                modLoaderVersion:
                  type: string
                  description: >
                    Loader version; for paper|purpur|folia the build number (digits). The build is
                    downloaded as server.jar and verified (SHA-256 for Paper and Folia, MD5 for
                    Purpur); a mismatching file is removed and provisioning fails.
                port: { type: integer }
                minRam: { type: string, pattern: '^[1-9]\d{0,5}[MG]$', example: "1G" }
                maxRam: { type: string, pattern: '^[1-9]\d{0,5}[MG]$', example: "2G", description: "Must not be below minRam when both are given" }
                jvmProfile:
                  type: string
                  enum: [default, aikar]
                  description: >
                    JVM flags profile. aikar = Aikar's G1GC flags with -Xms equal to -Xmx; applies
                    to all engines (Forge/NeoForge via user_jvm_args.txt). Stored on the server and
                    returned in server objects (omitted when empty).
                autoStart: { type: boolean }
                modpack:
                  type: object
                  description: Deploy from a Modrinth modpack instead of a plain server.
                  properties:
                    source: { type: string, example: modrinth }
                    projectId: { type: string }
                    versionId: { type: string }
                    mrpackUrl: { type: string }
                    name: { type: string }
      responses:
        "201": { description: Created }
        "400": { description: "Invalid input (bad RAM format, minRam above maxRam, unknown jvmProfile, malformed modLoaderVersion)" }
  /v1/servers/{id}:
    get:
      summary: Get a server
      responses: { "200": { description: OK }, "404": { description: Not found } }
    delete:
      summary: Delete a server
      responses: { "204": { description: Deleted } }
  /v1/servers/{id}/start:
    post: { summary: Start a server, responses: { "202": { description: Accepted } } }
  /v1/servers/{id}/stop:
    post: { summary: Stop a server, responses: { "202": { description: Accepted } } }
  /v1/servers/{id}/command:
    post:
      summary: Send a console command
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { command: { type: string } } }
      responses: { "200": { description: OK } }
  /v1/servers/{id}/logs:
    get: { summary: Buffered log history, responses: { "200": { description: OK } } }
  /v1/servers/{id}/console:
    get: { summary: "Live console stream (SSE): history then live lines", responses: { "200": { description: text/event-stream } } }
  /v1/events:
    get: { summary: "Host event stream (SSE): status changes", responses: { "200": { description: text/event-stream } } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
