openapi: 3.0.3
info:
  title: msmd — Minecraft Server Manager daemon
  version: 0.2.0
  description: >
    HTTP + Server-Sent-Events API for managing Minecraft servers on a remote
    host. All endpoints are served over TLS. Every route except /v1/health and
    /v1/pair requires a bearer token.
servers:
  - url: https://{host}:8443
    variables:
      host:
        default: localhost
security:
  - bearerAuth: []
paths:
  /v1/health:
    get:
      summary: Liveness probe (no auth)
      security: []
      responses:
        "200": { description: OK }
  /v1/pair:
    post:
      summary: Exchange the pairing token for the API token + host info (no auth header)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { token: { type: string } }
      responses:
        "200": { description: Paired }
        "401": { description: Invalid pairing token }
  /v1/info:
    get:
      summary: Host info (os, arch, detected Java installations, agent version)
      description: >-
        Also reports the host's clock as "time" (RFC 3339) and "timeZone" (abbreviation):
        scheduled restarts use that clock.
      responses: { "200": { description: OK } }
  /v1/loaders/{loader}/versions:
    get:
      summary: List available versions for a mod loader or plugin platform (fabric|quilt|forge|neoforge|paper|purpur|folia)
      description: >
        For paper, purpur and folia the result is the builds for the given Minecraft
        version, newest first, as `[{ "version": "<build>", "stable": true|false }]`.
      parameters:
        - { name: loader, in: path, required: true, schema: { type: string } }
        - { name: mc, in: query, required: false, schema: { type: string } }
      responses: { "200": { description: OK }, "400": { description: "Unknown loader, or a malformed mc for paper/purpur/folia" } }
  /v1/software/{platform}/versions:
    get:
      summary: List the Minecraft release versions a plugin platform has builds for (paper|purpur|folia)
      parameters:
        - { name: platform, in: path, required: true, schema: { type: string, enum: [paper, purpur, folia] } }
      responses:
        "200":
          description: JSON array of Minecraft release versions, newest first
          content:
            application/json:
              schema: { type: array, items: { type: string } }
        "400": { description: Unknown platform }
        "502": { description: The upstream API failed }
  /v1/servers:
    get:
      summary: List servers
      responses: { "200": { description: OK } }
    post:
      summary: Create a server (provisions asynchronously)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, minecraftVersion]
              properties:
                name: { type: string }
                minecraftVersion: { type: string, description: "Must be a release version for paper|purpur|folia" }
                modLoader: { type: string, enum: [fabric, quilt, forge, neoforge, paper, purpur, folia] }
                modLoaderVersion:
                  type: string
                  description: >
                    Loader version; for paper|purpur|folia the build number (digits). The build is
                    downloaded as server.jar and verified (SHA-256 for Paper and Folia, MD5 for
                    Purpur); a mismatching file is removed and provisioning fails.
                port: { type: integer }
                minRam: { type: string, pattern: '^[1-9]\d{0,5}[MG]$', example: "1G" }
                maxRam: { type: string, pattern: '^[1-9]\d{0,5}[MG]$', example: "2G", description: "Must not be below minRam when both are given" }
                jvmProfile:
                  type: string
                  enum: [default, aikar]
                  description: >
                    JVM flags profile. aikar = Aikar's G1GC flags with -Xms equal to -Xmx; applies
                    to all engines (Forge/NeoForge via user_jvm_args.txt). Stored on the server and
                    returned in server objects (omitted when empty).
                autoStart: { type: boolean }
                modpack:
                  type: object
                  description: Deploy from a Modrinth modpack instead of a plain server.
                  properties:
                    source: { type: string, example: modrinth }
                    projectId: { type: string }
                    versionId: { type: string }
                    mrpackUrl: { type: string, description: "https URL of the .mrpack on cdn.modrinth.com" }
                    name: { type: string }
      responses:
        "201": { description: Created }
        "400": { description: "Invalid input (bad RAM format, minRam above maxRam, unknown jvmProfile, malformed modLoaderVersion)" }
  /v1/servers/{id}:
    get:
      summary: Get a server
      description: >-
        Besides its settings and status, a server carries "operation" while a backup or a restore
        of it is running ({id, kind: backup|restore, phase: saving|copying|replacing, doneBytes,
        totalBytes}) and "lastOperation" once one has ended ({id, kind, ok, cancelled, error,
        warning, backupId, finishedAt}). lastOperation is kept in memory: it is gone after the
        daemon restarts. Both are omitted when there is nothing to report.
      responses: { "200": { description: OK }, "404": { description: Not found } }
    patch:
      summary: Change settings of a server
      description: >-
        Only the fields present in the body change. Unknown or read-only fields are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                restartSchedule:
                  type: string
                  nullable: true
                  description: >-
                    Daily restart time "HH:MM" (24-hour) on the host's clock. null or "" turns
                    it off. Players are warned 5 minutes and 1 minute before; only a running
                    server is restarted.
                  example: "04:30"
      responses:
        "200": { description: The updated server }
        "400": { description: Malformed schedule, or an unknown or read-only field }
        "404": { description: Unknown server }
    delete:
      summary: Delete a server
      description: >-
        Removes the server, its files and its backups. A backup or restore in progress is
        cancelled first (a restore that is already replacing files is finished). A server that is not running is gone when the call
        returns (204). A running one is told to stop first (202): it is in status "stopping"
        and disappears once its process has exited, shortly after the stop grace period at the latest. Watch for
        GET to answer 404. If it cannot be stopped it is kept, and its log says so. (Older
        daemons answered only once the server had stopped.)
      responses:
        "204": { description: Deleted }
        "202": { description: Accepted; the server is stopping and will then be deleted }
  /v1/servers/{id}/start:
    post:
      summary: Start a server
      responses:
        "202": { description: Accepted }
        "409": { description: "A backup or a restore of the server is in progress, or a restore left a .restore-aside folder next to it" }
  /v1/servers/{id}/stop:
    post:
      summary: Stop a server
      description: >-
        Sends the stop command and returns at once, with the server in status "stopping". The
        server gets the stop grace period (MSMD_STOP_GRACE, default 2m) to save and exit, and
        is killed after that. Watch the status until it is "stopped". (Older daemons answered
        only once the server had stopped.)
      responses: { "202": { description: Accepted } }
  /v1/servers/{id}/restart:
    post:
      summary: Restart a server
      description: >-
        Stops the server (as /stop does), waits until its process is gone and starts it again.
        Returns at once; watch the status. A server that is not running is started. A second
        request while a restart is in progress is accepted and changes nothing.
      responses:
        "202": { description: Accepted }
        "400": { description: The server is still being provisioned, or the daemon is shutting down }
        "404": { description: Unknown server }
  /v1/servers/{id}/backups:
    get:
      summary: List the backups of a server, newest first
      responses:
        "200":
          description: >-
            JSON array of {id, serverId, kind: manual|pre-restore, createdAt, sizeBytes,
            fileCount, minecraftVersion, whileRunning}. The last three come from the manifest in
            the archive and are omitted when it cannot be read.
        "404": { description: Unknown server }
    post:
      summary: Start a backup
      description: >-
        Returns at once with the id of the operation; follow it in the server's "operation" and
        read the outcome in its "lastOperation" (same id). The backup is a zip of the server
        folder in <data>/backups/<server id>/, without logs, crash-reports, debug, cache,
        libraries, versions, modpack.mrpack and session.lock; links are skipped. A running server
        is sent save-off and save-all flush and must confirm both before the copy starts, and
        save-on afterwards. Stopping, restarting or deleting the server, or shutting the daemon
        down, cancels the backup.
      responses:
        "202": { description: 'Accepted: {"ok": true, "operationId": "..."}' }
        "404": { description: Unknown server }
        "409":
          description: >-
            Not now: another backup or a restore is running, or the server is starting, stopping,
            restarting, being provisioned or deleted, or the daemon is shutting down
  /v1/servers/{id}/backups/{backupId}:
    delete:
      summary: Delete a backup
      responses:
        "204": { description: Deleted }
        "400": { description: Malformed backup id }
        "404": { description: Unknown server ("server not found") or backup ("backup not found") }
        "409": { description: A backup of this server is being restored }
  /v1/servers/{id}/backups/{backupId}/restore:
    post:
      summary: Restore a backup onto a stopped server
      description: >-
        Returns at once with the id of the operation, like starting a backup. The archive is
        unpacked next to the server and checked first: an archive without the manifest this
        daemon writes, with a path outside the server folder, a link, an entry backups do not
        cover, or more data or another number of files than its manifest says is refused and
        nothing changes. Then the entries backups cover are swapped for the unpacked ones (what
        backups do not cover, such as logs and libraries, stays); if the swap fails everything is
        moved back. Until the swap starts, deleting the server or shutting the daemon down
        cancels the restore; once it has started it is finished first. If the replaced files
        cannot be removed afterwards the restore still counts as done, with a "warning" naming
        the folder (<server dir>.restore-aside); the server does not start while it exists.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                backupFirst:
                  type: boolean
                  default: true
                  description: Back the current files up first (kind "pre-restore"), so the restore can be undone.
      responses:
        "202": { description: 'Accepted: {"ok": true, "operationId": "..."}' }
        "400": { description: Malformed backup id or body }
        "404": { description: Unknown server ("server not found") or backup ("backup not found") }
        "409": { description: The server is running, or another operation is in progress (see POST backups) }
  /v1/servers/{id}/command:
    post:
      summary: Send a console command
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { command: { type: string } } }
      responses: { "200": { description: OK } }
  /v1/servers/{id}/logs:
    get: { summary: Buffered log history, responses: { "200": { description: OK } } }
  /v1/servers/{id}/console:
    get: { summary: "Live console stream (SSE): history then live lines", responses: { "200": { description: text/event-stream } } }
  /v1/events:
    get: { summary: "Host event stream (SSE): status changes", responses: { "200": { description: text/event-stream } } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
