name: CI

# One pipeline for the whole repository:
#   - "Desktop app" tests the Electron UI (type-check, unit tests, production
#     build, and end-to-end tests that drive the real built app).
#   - "Daemon" tests the Go agent (format, vet, race-enabled unit tests,
#     cross-compilation, and an end-to-end smoke test against the real binary).
#   - "CI passed" is the single status check to require in branch protection.
#
# Every job runs on every push and pull request (no path filters), so the
# required check can never be left pending.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: Desktop app (Windows)
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify the Electron binary is installed
        shell: bash
        run: test -f node_modules/electron/dist/electron.exe

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: End-to-end UI tests
        run: npm run test:e2e:only

      - name: Upload Playwright report
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  daemon:
    name: Daemon (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum supported Go version (from daemon/go.mod).
          - os: ubuntu-latest
            go: '1.22'
          - os: ubuntu-latest
            go: stable
          # The daemon also ships a Windows binary.
          - os: windows-latest
            go: stable
    defaults:
      run:
        working-directory: daemon
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false # the daemon has no module dependencies to cache

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        if: matrix.os != 'ubuntu-latest'
        run: go test ./...

      - name: Unit tests (race detector)
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...

      - name: Cross-compile release targets
        if: matrix.os == 'ubuntu-latest'
        run: make cross

      - name: Smoke test (real binary over TLS)
        run: sh scripts/smoke.sh

  ci-ok:
    name: CI passed
    if: ${{ always() }}
    needs: [app, daemon]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          APP_RESULT: ${{ needs.app.result }}
          DAEMON_RESULT: ${{ needs.daemon.result }}
        run: |
          echo "app: $APP_RESULT"
          echo "daemon: $DAEMON_RESULT"
          if [ "$APP_RESULT" != "success" ] || [ "$DAEMON_RESULT" != "success" ]; then
            echo "One or more jobs did not succeed."
            exit 1
          fi
