name: Daemon CI

on:
  push:
    branches: [main]
    paths: ['daemon/**', '.github/workflows/daemon.yml']
  pull_request:
    branches: [main]
    paths: ['daemon/**', '.github/workflows/daemon.yml']

concurrency:
  group: daemon-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Cross-compile
        run: make cross
